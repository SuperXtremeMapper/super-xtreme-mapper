<script type="module" nonce="0769a31e3e21da890716b31021d57fdb">window['vanillaInitialLayout'] = {"query":{"layoutViewType":"post","recordType":"discussion","recordID":9022,"params":{"discussionID":9022,"sort":null,"locale":"en","siteSectionID":"0"}},"data":{"layoutID":22,"name":"Question July 2025","layoutViewType":"question","isDefault":true,"layout":[{"$seoContent":"<section>\n<div class=\"seoSectionRow seoBreadcrumbs\"><div class='seoSectionPiece'><div class='sectionItem'><div class=\"pageBox\">\n        <ul class=\"linkList\">\n<li>\n<a href=\"https:\/\/community.native-instruments.com\/\">Home<\/a>\n<\/li>\n<li>\n<a href=\"https:\/\/community.native-instruments.com\/categories\/traktor-software-hardware\">Traktor Software &amp; Hardware<\/a>\n<\/li>\n<li>\n<a href=\"https:\/\/community.native-instruments.com\/categories\/mapping-traktor\">Mapping Traktor<\/a>\n<\/li>\n<\/ul>\n    <\/div><\/div><\/div><\/div>\n<div class=\"seoSectionColumn mainColumn\"><div class='seoSectionPiece'><div class='sectionItem'>    <h1>Why does the S4MK3 still not have MIDI mode?<\/h1>\n    <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n    <div class=\"userContent\">\n        <p>I don't even know how to put this politely anymore. <\/p><p>It's been four years and the S4Mk3 still has no MIDI mode.<\/p><p>This is far beyond disgusting. I'ts feels more like a Pioneer move honestly.<\/p><p>When is NI going to fix this?<\/p>\n    <\/div>\n<\/div><div class='sectionItem'><div class=\"pageBox\">\n        <div class=\"pageHeadingBox\">\n        <h2>Find more posts tagged with<\/h2>                    <\/div>\n        \n    <\/div><\/div><div class='sectionItem'><div class=\"pageBox\">\n            <h2>Accepted answers<\/h2>\n            <div class=\"comment separated\">\n            <div><a href=\"https:\/\/community.native-instruments.com\/profile\/MichaelK_NI\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/avatarstock\/nX1A2T0QV2TZ2.png\" alt=\"Photo of MichaelK_NI\" \/>\n<span class=\"seoUserName\">MichaelK_NI<\/span>\n<\/a><\/div>\n            <div class=\"userContent\"><p>Hi everybody,<\/p><p>let me quickly add some insights here. We did not remove MIDI implementation off of the S2 MK3, S3 or S4 MK3. The facts are the following:<\/p><p><strong>S2 and S3<\/strong> have what we call native MIDI support. These two units have a specific MIDI control assigned to each button and knob on the device as part of their firmware. This eliminated the need to use the Controller Editor for these units. Unfortunately this also removes the option to change the Note or CC that a specific control is sending. <\/p><p>Bottom line, these devices send MIDI but do not support customisability of what kind of messages are being send.<\/p><p><strong>S4 MK3<\/strong> has never supported MIDI in the first place. This has been a decision we needed to take back during the development process due to the increased architectural complexity of the product.<\/p><p>I hope this has cleared things up a bit <span class=\"safeEmoji nativeEmoji\">\ud83d\ude01<\/span>.<\/p><p>cheers from Berlin<\/p><p>Michael<\/p><\/div>\n        <\/div>\n        <h2>All comments<\/h2>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Stevan\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/EYDZ9GQBNDCK\/n8QM32N4O6JFZ.png\" alt=\"Photo of Stevan\" \/>\n<span class=\"seoUserName\">Stevan<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>In case you did not know, the S2 MK3 and S3 MIDI Modes has been removed from the firmware and the Controller Editor!<\/p><p>Chances are wery low that we will ever get the MIDI mode on S4.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Thanks for the insight.<\/p><p><br\/><\/p><p>Well that is a very aggressive move against the needs of the costumers. I'm thinking of leaving the Traktor platform altogether.<\/p><p>Enough is enough.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/The%20Sarge\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/PP5NRGFLIC3F\/n9DGTI182LXUU.png\" alt=\"Photo of The Sarge\" \/>\n<span class=\"seoUserName\">The Sarge<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>sorry for asking, but I\u00b4m new to Traktor:<\/p><p>what was the MIDI Mode planed for?<\/p><p>I\u00b4ve seen a video where someone is controlling Traktor over Maschine, and that was MIDI, but our S4 is in my opinion at the moment fully able to control Traktor Pro, isn\u00b4t it?<\/p><p>PS: have mercy for my english and for my little knowledge about S4 (so much to read &amp; learn)<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/B3W1VXXQZHCT\/nDAZCAX4KWL7X.jpg\" alt=\"Photo of lord-carlos\" \/>\n<span class=\"seoUserName\">lord-carlos<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Midi mode on s4mk3 would allow easy to use the controller with <strong>other <\/strong>midi software.<\/p><p>Right now if you want to use s4 mk3 on other software the Developers have to put in some work to make it workable with HID. For example Mixxx has done so.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p><a class=\"atMention\" data-username=\"lord-carlos\" data-userid=\"401227\" href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\">@lord-carlos<\/a> That\u2018s right but missing my point a bit. I\u2018m no company capable of doing HID code. I\u2018m just a user with a big controller that can\u2018t be used for anything else than Traktor.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/B3W1VXXQZHCT\/nDAZCAX4KWL7X.jpg\" alt=\"Photo of lord-carlos\" \/>\n<span class=\"seoUserName\">lord-carlos<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:46586,&quot;recordType&quot;:&quot;comment&quot;,&quot;body&quot;:&quot;&lt;p&gt;&lt;a class=\\&quot;atMention\\&quot; data-username=\\&quot;lord-carlos\\&quot; data-userid=\\&quot;401227\\&quot; href=\\&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/lord-carlos\\&quot;&gt;@lord-carlos&lt;\\\/a&gt; That&amp;lsquo;s right but missing my point a bit. I&amp;lsquo;m no company capable of doing HID code. I&amp;lsquo;m just a user with a big controller that can&amp;lsquo;t be used for anything else than Traktor.&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:{\\&quot;mention\\&quot;:{\\&quot;name\\&quot;:\\&quot;lord-carlos\\&quot;,\\&quot;userID\\&quot;:401227}}},{\\&quot;insert\\&quot;:\\&quot; That\u2018s right but missing my point a bit. I\u2018m no company capable of doing HID code. I\u2018m just a user with a big controller that can\u2018t be used for anything else than Traktor. \\\\n\\\\n\\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2022-12-28T07:59:06+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:283103,&quot;name&quot;:&quot;marinelli&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/marinelli&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/s.gravatar.com\\\/avatar\\\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png&quot;,&quot;dateLastActive&quot;:&quot;2025-07-10T14:34:35+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Helper&quot;,&quot;labelHtml&quot;:&quot;Helper&quot;,&quot;rankID&quot;:3},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:false,&quot;showPostLink&quot;:false,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/46586#Comment_46586&quot;,&quot;embedType&quot;:&quot;quote&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/comment\/46586#Comment_46586\">\n        https:\/\/community.native-instruments.com\/discussion\/comment\/46586#Comment_46586\n    <\/a>\n<\/div>\n<p>I know. I was just answering The Sarge question.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/The%20Sarge\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/PP5NRGFLIC3F\/n9DGTI182LXUU.png\" alt=\"Photo of The Sarge\" \/>\n<span class=\"seoUserName\">The Sarge<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>thx <a class=\"atMention\" data-username=\"lord-carlos\" data-userid=\"401227\" href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\">@lord-carlos<\/a> for explaining this to me<\/p><p>so I see that there\u00b4s nothing for me(!) missing, cause I use KK S88 and Maschine Mk2 for the other things in controlling of MIDI<\/p><p><a class=\"atMention\" data-username=\"marinelli\" data-userid=\"283103\" href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\">@marinelli<\/a> <\/p><p>sorry for hijacking your topic :(<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Stevan\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/EYDZ9GQBNDCK\/n8QM32N4O6JFZ.png\" alt=\"Photo of Stevan\" \/>\n<span class=\"seoUserName\">Stevan<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:46500,&quot;recordType&quot;:&quot;comment&quot;,&quot;body&quot;:&quot;&lt;p&gt;Thanks for the insight.&lt;\\\/p&gt;&lt;p&gt;Well that is a very aggressive move against the needs of the costumers. I&amp;#039;m thinking of leaving the Traktor platform altogether.&lt;\\\/p&gt;&lt;p&gt;Enough is enough.&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:\\&quot;Thanks for the insight.\\\\n\\\\nWell that is a very aggressive move against the needs of the costumers. I'm thinking of leaving the Traktor platform altogether.\\\\nEnough is enough.\\\\n\\\\n\\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2022-12-27T14:38:36+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:283103,&quot;name&quot;:&quot;marinelli&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/marinelli&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/s.gravatar.com\\\/avatar\\\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png&quot;,&quot;dateLastActive&quot;:&quot;2025-07-10T14:34:35+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Helper&quot;,&quot;labelHtml&quot;:&quot;Helper&quot;,&quot;rankID&quot;:3},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:false,&quot;showPostLink&quot;:false,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/46500#Comment_46500&quot;,&quot;embedType&quot;:&quot;quote&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/comment\/46500#Comment_46500\">\n        https:\/\/community.native-instruments.com\/discussion\/comment\/46500#Comment_46500\n    <\/a>\n<\/div>\n<p>All have some kind of issues or sounds worse or are limited in other ways.<\/p><p>I think you should just sell your S4 MK3 and get an MK2. I use my S2 MK2 all the time.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>MK2 feels like a toy compared to the MK3. Also MK3 is the perfect Traktor-Controller for me. <\/p><p>The question is not which Kontrol is the best for me but rather if there's any future with the platform at all. <\/p><p>If the pattern player has priority before elastic grids or stem separation or giving the S4 a MIDI mode than I don't know if I still believe that Traktor is my platform. <\/p><p>Of course it is still the best software out there when it comes to sound, effects, tightness and so on.<\/p><p>If I could Drag and Drop tracks from Rekordbox to Traktor I would just use them parallel.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Stevan\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/EYDZ9GQBNDCK\/n8QM32N4O6JFZ.png\" alt=\"Photo of Stevan\" \/>\n<span class=\"seoUserName\">Stevan<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Yeah MK2 could be compared as a toy but comes with a MIDI Mode if you really need it. And it is fully overmappable unlike S4 MK3.<\/p><p>Also nothing wrong with MK2. I has one of first S2 MK2 controllers ever made and it still works perfectly. We'll see how MK3's compares after that many years.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Did you get that I'm not talking about a specific hardware? I have plenty of controllers to use. <\/p><p>The problem is NI itself in my opinion. Not giving the S4MK3 a MIDI mode could be caused by a lack of resources. But removing it actively from S2MK3 and S3 is a paradigm shift in  NI's attitude towards its customers in my opinion.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Markovicz\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/UG9PC79DRNVE\/n8WTWQQW57K15.jpg\" alt=\"Photo of Markovicz\" \/>\n<span class=\"seoUserName\">Markovicz<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:9022,&quot;recordType&quot;:&quot;discussion&quot;,&quot;body&quot;:&quot;&lt;p&gt;I don&amp;#039;t even know how to put this politely anymore. &lt;\\\/p&gt;&lt;p&gt;It&amp;#039;s been four years and the S4Mk3 still has no MIDI mode.&lt;\\\/p&gt;&lt;p&gt;This is far beyond disgusting. I&amp;#039;ts feels more like a Pioneer move honestly.&lt;\\\/p&gt;&lt;p&gt;When is NI going to fix this?&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:\\&quot;I don't even know how to put this politely anymore. \\\\nIt's been four years and the S4Mk3 still has no MIDI mode.\\\\nThis is far beyond disgusting. I'ts feels more like a Pioneer move honestly.\\\\nWhen is NI going to fix this?\\\\n\\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2022-12-27T11:31:12+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:283103,&quot;name&quot;:&quot;marinelli&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/marinelli&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/s.gravatar.com\\\/avatar\\\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png&quot;,&quot;dateLastActive&quot;:&quot;2025-07-10T14:34:35+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Helper&quot;,&quot;labelHtml&quot;:&quot;Helper&quot;,&quot;rankID&quot;:3},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:true,&quot;showPostLink&quot;:true,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/9022\\\/why-does-the-s4mk3-still-not-have-midi-mode&quot;,&quot;embedType&quot;:&quot;quote&quot;,&quot;name&quot;:&quot;Why does the S4MK3 still not have MIDI mode?&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/9022\/why-does-the-s4mk3-still-not-have-midi-mode\">\n        https:\/\/community.native-instruments.com\/discussion\/9022\/why-does-the-s4mk3-still-not-have-midi-mode\n    <\/a>\n<\/div>\n<p>Hi <a class=\"atMention\" data-username=\"marinelli\" data-userid=\"283103\" href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\">@marinelli<\/a>, <\/p><p>from what I heard, this decision has been made during the development of the S4 MK3 based on two basic shortcomings that would apply when trying to use the controller in MIDI mode: neither the jog wheels nor the displays would be functional, and this is a technical limitation you couldn't work around. <\/p><p>I am not trying to justify this decision, just sharing context.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Markovicz\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/UG9PC79DRNVE\/n8WTWQQW57K15.jpg\" alt=\"Photo of Markovicz\" \/>\n<span class=\"seoUserName\">Markovicz<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div MK3 and S3 can be set to MIDI mode and used with other applications: <\/p><p><a href=\"https:\/\/support.native-instruments.com\/hc\/en-us\/search\/click?data=BAh7DjoHaWRsKwi%2BYQ3SUwA6D2FjY291bnRfaWRpA9ijCzoJdHlwZUkiDGFydGljbGUGOgZFVDoIdXJsSSIBfGh0dHBzOi8vc3VwcG9ydC5uYXRpdmUtaW5zdHJ1bWVudHMuY29tL2hjL2VuLXVzL2FydGljbGVzLzM2MDAwNjM3NzkxOC1Ib3ctdG8tU3dpdGNoLVlvdXItVFJBS1RPUi1LT05UUk9MLVMyLU1LMy10by1NSURJLU1vZGUGOwhUOg5zZWFyY2hfaWRJIik5ZDAyYjkxMS1kYjczLTQ0NjAtOWJhZC0zZTA1ZmYzNDM2MmIGOwhGOglyYW5raQg6C2xvY2FsZUkiCmVuLXVzBjsIVDoKcXVlcnlJIg5NSURJIG1vZGUGOwhUOhJyZXN1bHRzX2NvdW50aQIqAQ%3D%3D--e10e5bf46b6866fb3863b5293a03733535fee72f\" rel=\"nofollow noopener ugc\"><strong>How to Switch Your TRAKTOR KONTROL S2 MK3 to MIDI Mode<\/strong><\/a><\/p><p><a href=\"https:\/\/support.native-instruments.com\/hc\/en-us\/search\/click?data=BAh7DjoHaWRsKwil9wzSUwA6D2FjY291bnRfaWRpA9ijCzoJdHlwZUkiDGFydGljbGUGOgZFVDoIdXJsSSJ9aHR0cHM6Ly9zdXBwb3J0Lm5hdGl2ZS1pbnN0cnVtZW50cy5jb20vaGMvZW4tdXMvYXJ0aWNsZXMvMzYwMDA2MzUwNzU3LUhvdy10by1Td2l0Y2gtWW91ci1UUkFLVE9SLUtPTlRST0wtUzMtdG8tTUlESS1Nb2RlBjsIVDoOc2VhcmNoX2lkSSIpOWQwMmI5MTEtZGI3My00NDYwLTliYWQtM2UwNWZmMzQzNjJiBjsIRjoJcmFua2kGOgtsb2NhbGVJIgplbi11cwY7CFQ6CnF1ZXJ5SSIOTUlESSBtb2RlBjsIVDoScmVzdWx0c19jb3VudGkCKgE%3D--22c97a118364e2193ea10b7a18e44eb01984e9b7\" rel=\"nofollow noopener ugc\"><strong>How to Switch Your TRAKTOR KONTROL S3 to MIDI Mode<\/strong><\/a><\/p><p>The way this is technically implemented simply does not rely on the Controller Editor.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/zephry\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/CBTZXJICRX42\/nCOGIMBFB4O2U.png\" alt=\"Photo of zephry\" \/>\n<span class=\"seoUserName\">zephry<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:53602,&qu is is a technical limitation you couldn't work around. \\\\nI am not trying to justify this decision, just sharing context. \\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2023-02-17T09:05:34+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:348264,&quot;name&quot;:&quot;Markovicz&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/Markovicz&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/us.v-cdn.net\\\/6034896\\\/uploads\\\/userpics\\\/UG9PC79DRNVE\\\/n8WTWQQW57K15.jpg&quot;,&quot;dateLastActive&quot;:&quot;2026-02-23T11:14:13+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Pro&quot;,&quot;labelHtml&quot;:&quot;Pro&quot;,&quot;rankID&quot;:117},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:false,&quot;showPostLink&quot;:false,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/53602#Comment_53602&quot;,&quot;embedType&quot;:&quot;quote&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/comment\/53602#Comment_53602\">\n        https:\/\/community.native-instruments.com\/discussion\/comment\/53602#Comment_53602\n    <\/a>\n<\/div>\n<p>The driver is not even available for the mk3.<\/p><p>It is definitely more intricate than previous controllers. As said \"the jogs!\"<\/p><p>Although I think the initial release of the S4mk3 had no midi mappable controls at all, NI did add some later.<\/p><p>My guess is that it would have been a support nightmare, everyone constantly saying they couldn't get it to work.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Markovicz\" class=\"seoUser\">\n eactComponent":"OriginalPostAsset","$seoContent":"    <h1>Why does the S4MK3 still not have MIDI mode?<\/h1>\n    <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n    <div class=\"userContent\">\n        <p>I don't even know how to put this politely anymore. <\/p><p>It's been four years and the S4Mk3 still has no MIDI mode.<\/p><p>This is far beyond disgusting. I'ts feels more like a Pioneer move honestly.<\/p><p>When is NI going to fix this?<\/p>\n    <\/div>\n","$reactProps":{"discussion":{"discussionID":9022,"type":"question","name":"Why does the S4MK3 still not have MIDI mode?","body":"<p>I don't even know how to put this politely anymore. <\/p><p>It's been four years and the S4Mk3 still has no MIDI mode.<\/p><p>This is far beyond disgusting. I'ts feels more like a Pioneer move honestly.<\/p><p>When is NI going to fix this?<\/p>","categoryID":55,"dateInserted":"2022-12-27T11:31:12+00:00","dateUpdated":"2024-03-05T07:23:33+00:00","dateLastComment":"2025-05-09T10:42:42+00:00","insertUserID":283103,"insertUser":{"userID":283103,"name":"marinelli","url":"https:\/\/community.native-instruments.com\/profile\/marinelli","photoUrl":"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&r=pg&d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png","dateLastActive":"2025-07-10T14:34:35+00:00","banned":0,"punished":0,"private":false,"label":"Helper","labelHtml":"Helper","postProfileFields":[{"value":"OS","displayOptions":{"userCards":false,"posts":false}}],"rankID":3,"badges":[{"badgeID":98,"name":"Original Member Silver","dateInserted":"2021-11-19T13:16:23+00:00","url":"https:\/\/community.native-instruments.com\/badge\/98\/original-member-3", \/9022\/why-does-the-s4mk3-still-not-have-midi-mode","canonicalUrl":"https:\/\/community.native-instruments.com\/discussion\/9022\/why-does-the-s4mk3-still-not-have-midi-mode","format":"Rich","labelCodes":["Accepted"],"breadcrumbs":[{"name":"Home","url":"https:\/\/community.native-instruments.com\/"},{"name":"Traktor Software & Hardware","url":"https:\/\/community.native-instruments.com\/categories\/traktor-software-hardware","recordID":19},{"name":"Mapping Traktor","url":"https:\/\/community.native-instruments.com\/categories\/mapping-traktor","recordID":55}],"groupID":null,"statusID":3,"images":[],"attributes":{"question":{"status":"accepted","dateAccepted":"2023-02-28T09:45:48+00:00","dateAnswered":"2023-02-27T14:47:26+00:00","acceptedAnswers":[{"commentID":55510,"body":"<p>Hi everybody,<\/p><p>let me quickly add some insights here. We did not remove MIDI implementation off of the S2 MK3, S3 or S4 MK3. The facts are the following:<\/p><p><strong>S2 and S3<\/strong> have what we call native MIDI support. These two units have a specific MIDI control assigned to each button and knob on the device as part of their firmware. This eliminated the need to use the Controller Editor for these units. Unfortunately this also removes the option to change the Note or CC that a specific control is sending. <\/p><p>Bottom line, these devices send MIDI but do not support customisability of what kind of messages are being send.<\/p><p><strong>S4 MK3<\/strong> has never supported MIDI in the first place. This has been a decision we needed to take back during the development process due to the increased architectural complexity of the product.<\/p><p>I hope this has cleared things up a bit <span class=\"safeEmoji nativeEmoji\">\ud83d\ude01<\/span>.<\/p><p>cheers from Berlin<\/p><p>Michael<\/p>","insertUserID":260850,"url":"https:\/\/community.native-instruments.com\/discussion\/comment\/55510#Comment_55510","dateInserted":"2023-02-27 14:47:26","score":5,"insertUser":{"userID":260850 ese devices send MIDI but do not support customisability of what kind of messages are being send.<\/p><p><strong>S4 MK3<\/strong> has never supported MIDI in the first place. This has been a decision we needed to take back during the development process due to the increased architectural complexity of the product.<\/p><p>I hope this has cleared things up a bit <span class=\"safeEmoji nativeEmoji\">\ud83d\ude01<\/span>.<\/p><p>cheers from Berlin<\/p><p>Michael<\/p>","insertUserID":260850,"url":"https:\/\/community.native-instruments.com\/discussion\/comment\/55510#Comment_55510","dateInserted":"2023-02-27 14:47:26","score":5,"insertUser":{"userID":260850,"name":"MichaelK_NI","url":"https:\/\/community.native-instruments.com\/profile\/MichaelK_NI","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/avatarstock\/nX1A2T0QV2TZ2.png","dateLastActive":"2026-06-29T16:36:51+00:00","banned":0,"punished":0,"private":false,"label":"Pro","labelHtml":"Pro","postProfileFields":[{"value":"n\/a","displayOptions":{"userCards":false,"posts":false}}],"rankID":117}}]}},"reactions":[{"tagID":11,"urlcode":"Down","name":"Vote Down","class":"Negative","hasReacted":false,"reactionValue":-1,"count":0},{"tagID":12,"urlcode":"Up","name":"Vote Up","class":"Positive","hasReacted":false,"reactionValue":1,"count":0},{"tagID":15,"urlcode":"LOL","name":"Funny","class":"Positive","hasReacted":false,"reactionValue":0,"count":0}],"tags":[],"postMeta":[],"permissions":{"comments.add":false,"comments.delete":false,"comments.edit":false,"discussions.add":false,"discussions.announce":false,"discussions.close":false,"discussions.delete":false,"discussions.edit":false,"discussions.sink":false,"discussions.view":true,"posts.moderate":false},"tagIDs":[],"bookmarked":false,"unread":false,"dismissed":false,"muted":false,"dateLastViewed":null,"category":{"categoryID":55,"name":"Mapping Traktor","description":"","url":"https:\/\/community.native-instruments.com\/categories\/mapping-traktor","allowedDiscussionTypes":["discussion","poll"]},"updateUser":{"userID":247166,"name":"Stevan","url":"https:\/\/community.native-instruments.com\/profile\/Stevan","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/EYDZ9GQBNDCK\/n8QM32N4O6JFZ.png","dateLastActive":"2026-09-11T15:17:39+00:00","banned":0,"punished":0,"private":false,"label":"Expert","labelHtml":"Expert","postProfileFields":[{"value":"macOS Sequoia","displayOptions":{"userCards":false,"posts":false}},{"value":"Apple M4 (24 GB RAM)","displayOptions":{"userCards":false,"posts":false}},{"value":"Z2, S8, D2, S2mk2, S4mk3, Z1mk2, X1mk2, X1mk3, F1, Maschine Mk3, Mikro mk3, Jam, M32","displayOptions":{"userCards":false,"posts":false}},{"value":"Traktor Mapping Specialist, Timetraveler, DJtechfool","displayOptions":{"userCards":false,"posts":false}}],"rankID":5}},"discussionApiParams":{"expand":["tags","insertUser","updateUser","breadcrumbs","reactions","attachments","reportMeta","category","permissions","dateLastViewed","insertUser.badges","warnings","insertUser.signature","postMeta","acceptedAnswers","rejectedAnswers"]}}},{"$reactComponent":"AnswerThreadAsset","$seoContent":"<div class=\"pageBox\">\n            <h2>Accepted answers<\/h2>\n            <div class=\"comment separated\">\n            <div><a href=\"https:\/\/community.native-instruments.com\/profile\/MichaelK_NI\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/avatarstock\/nX1A2T0QV2TZ2.png\" alt=\"Photo of MichaelK_NI\" \/>\n<span class=\"seoUserName\">MichaelK_NI<\/span>\n<\/a><\/div>\n            <div class=\"userContent\"><p>Hi everybody,<\/p><p>let me quickly add some insights here. We did not remove MIDI implementation off of the S2 MK3, S3 or S4 MK3. The facts are the following:<\/p><p><strong>S2 and S3<\/strong> have what we call native MIDI support. These two units have a specific MIDI control assigned to each button and knob on the device as part of their firmware. This eliminated the need to use the Controller Editor for these units. Unfortunately this also removes the option to change the Note or CC that a specific control is sending. <\/p><p>Bottom line, these devices send MIDI but do not support customisability of what kind of messages are being send.<\/p><p><strong>S4 MK3<\/strong> has never supported MIDI in the first place. This has been a decision we needed to take back during the development process due to the increased architectural complexity of the product.<\/p><p>I hope this has cleared things up a bit <span class=\"safeEmoji nativeEmoji\">\ud83d\ude01<\/span>.<\/p><p>cheers from Berlin<\/p><p>Michael<\/p><\/div>\n        <\/div>\n        <h2>All comments<\/h2>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Stevan\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/EYDZ9GQBNDCK\/n8QM32N4O6JFZ.png\" alt=\"Photo of Stevan\" \/>\n<span class=\"seoUserName\">Stevan<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>In case you did not know, the S2 MK3 and S3 MIDI Modes has been removed from the firmware and the Controller Editor!<\/p><p>Chances are wery low that we will ever get the MIDI mode on S4.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Thanks for the insight.<\/p><p><br\/><\/p><p>Well that is a very aggressive move against the needs of the costumers. I'm thinking of leaving the Traktor platform altogether.<\/p><p>Enough is enough.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/The%20Sarge\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/PP5NRGFLIC3F\/n9DGTI182LXUU.png\" alt=\"Photo of The Sarge\" \/>\n<span class=\"seoUserName\">The Sarge<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>sorry for asking, but I\u00b4m new to Traktor:<\/p><p>what was the MIDI Mode planed for?<\/p><p>I\u00b4ve seen a video where someone is controlling Traktor over Maschine, and that was MIDI, but our S4 is in my opinion at the moment fully able to control Traktor Pro, isn\u00b4t it?<\/p><p>PS: have mercy for my english and for my little knowledge about S4 (so much to read &amp; learn)<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/B3W1VXXQZHCT\/nDAZCAX4KWL7X.jpg\" alt=\"Photo of lord-carlos\" \/>\n<span class=\"seoUserName\">lord-carlos<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Midi mode on s4mk3 would allow easy to use the controller with <strong>other <\/strong>midi software.<\/p><p>Right now if you want to use s4 mk3 on other software the Developers have to put in some work to make it workable with HID. For example Mixxx has done so.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p><a class=\"atMention\" data-username=\"lord-carlos\" data-userid=\"401227\" href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\">@lord-carlos<\/a> That\u2018s right but missing my point a bit. I\u2018m no company capable of doing HID code. I\u2018m just a user with a big controller that can\u2018t be used for anything else than Traktor.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/B3W1VXXQZHCT\/nDAZCAX4KWL7X.jpg\" alt=\"Photo of lord-carlos\" \/>\n<span class=\"seoUserName\">lord-carlos<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:46586,&quot;recordType&quot;:&quot;comment&quot;,&quot;body&quot;:&quot;&lt;p&gt;&lt;a class=\\&quot;atMention\\&quot; data-username=\\&quot;lord-carlos\\&quot; data-userid=\\&quot;401227\\&quot; href=\\&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/lord-carlos\\&quot;&gt;@lord-carlos&lt;\\\/a&gt; That&amp;lsquo;s right but missing my point a bit. I&amp;lsquo;m no company capable of doing HID code. I&amp;lsquo;m just a user with a big controller that can&amp;lsquo;t be used for anything else than Traktor.&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:{\\&quot;mention\\&quot;:{\\&quot;name\\&quot;:\\&quot;lord-carlos\\&quot;,\\&quot;userID\\&quot;:401227}}},{\\&quot;insert\\&quot;:\\&quot; That\u2018s right but missing my point a bit. I\u2018m no company capable of doing HID code. I\u2018m just a user with a big controller that can\u2018t be used for anything else than Traktor. \\\\n\\\\n\\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2022-12-28T07:59:06+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:283103,&quot;name&quot;:&quot;marinelli&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/marinelli&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/s.gravatar.com\\\/avatar\\\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png&quot;,&quot;dateLastActive&quot;:&quot;2025-07-10T14:34:35+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Helper&quot;,&quot;labelHtml&quot;:&quot;Helper&quot;,&quot;rankID&quot;:3},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:false,&quot;showPostLink&quot;:false,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/46586#Comment_46586&quot;,&quot;embedType&quot;:&quot;quote&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/comment\/46586#Comment_46586\">\n        https:\/\/community.native-instruments.com\/discussion\/comment\/46586#Comment_46586\n    <\/a>\n<\/div>\n<p>I know. I was just answering The Sarge question.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/The%20Sarge\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/PP5NRGFLIC3F\/n9DGTI182LXUU.png\" alt=\"Photo of The Sarge\" \/>\n<span class=\"seoUserName\">The Sarge<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>thx <a class=\"atMention\" data-username=\"lord-carlos\" data-userid=\"401227\" href=\"https:\/\/community.native-instruments.com\/profile\/lord-carlos\">@lord-carlos<\/a> for explaining this to me<\/p><p>so I see that there\u00b4s nothing for me(!) missing, cause I use KK S88 and Maschine Mk2 for the other things in controlling of MIDI<\/p><p><a class=\"atMention\" data-username=\"marinelli\" data-userid=\"283103\" href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\">@marinelli<\/a> <\/p><p>sorry for hijacking your topic :(<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Stevan\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/EYDZ9GQBNDCK\/n8QM32N4O6JFZ.png\" alt=\"Photo of Stevan\" \/>\n<span class=\"seoUserName\">Stevan<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:46500,&quot;recordType&quot;:&quot;comment&quot;,&quot;body&quot;:&quot;&lt;p&gt;Thanks for the insight.&lt;\\\/p&gt;&lt;p&gt;Well that is a very aggressive move against the needs of the costumers. I&amp;#039;m thinking of leaving the Traktor platform altogether.&lt;\\\/p&gt;&lt;p&gt;Enough is enough.&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:\\&quot;Thanks for the insight.\\\\n\\\\nWell that is a very aggressive move against the needs of the costumers. I'm thinking of leaving the Traktor platform altogether.\\\\nEnough is enough.\\\\n\\\\n\\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2022-12-27T14:38:36+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:283103,&quot;name&quot;:&quot;marinelli&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/marinelli&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/s.gravatar.com\\\/avatar\\\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png&quot;,&quot;dateLastActive&quot;:&quot;2025-07-10T14:34:35+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Helper&quot;,&quot;labelHtml&quot;:&quot;Helper&quot;,&quot;rankID&quot;:3},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:false,&quot;showPostLink&quot;:false,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/46500#Comment_46500&quot;,&quot;embedType&quot;:&quot;quote&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/comment\/46500#Comment_46500\">\n        https:\/\/community.native-instruments.com\/discussion\/comment\/46500#Comment_46500\n    <\/a>\n<\/div>\n<p>All have some kind of issues or sounds worse or are limited in other ways.<\/p><p>I think you should just sell your S4 MK3 and get an MK2. I use my S2 MK2 all the time.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>MK2 feels like a toy compared to the MK3. Also MK3 is the perfect Traktor-Controller for me. <\/p><p>The question is not which Kontrol is the best for me but rather if there's any future with the platform at all. <\/p><p>If the pattern player has priority before elastic grids or stem separation or giving the S4 a MIDI mode than I don't know if I still believe that Traktor is my platform. <\/p><p>Of course it is still the best software out there when it comes to sound, effects, tightness and so on.<\/p><p>If I could Drag and Drop tracks from Rekordbox to Traktor I would just use them parallel.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Stevan\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/EYDZ9GQBNDCK\/n8QM32N4O6JFZ.png\" alt=\"Photo of Stevan\" \/>\n<span class=\"seoUserName\">Stevan<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Yeah MK2 could be compared as a toy but comes with a MIDI Mode if you really need it. And it is fully overmappable unlike S4 MK3.<\/p><p>Also nothing wrong with MK2. I has one of first S2 MK2 controllers ever made and it still works perfectly. We'll see how MK3's compares after that many years.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/s.gravatar.com\/avatar\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png\" alt=\"Photo of marinelli\" \/>\n<span class=\"seoUserName\">marinelli<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><p>Did you get that I'm not talking about a specific hardware? I have plenty of controllers to use. <\/p><p>The problem is NI itself in my opinion. Not giving the S4MK3 a MIDI mode could be caused by a lack of resources. But removing it actively from S2MK3 and S3 is a paradigm shift in  NI's attitude towards its customers in my opinion.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Markovicz\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/UG9PC79DRNVE\/n8WTWQQW57K15.jpg\" alt=\"Photo of Markovicz\" \/>\n<span class=\"seoUserName\">Markovicz<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:9022,&quot;recordType&quot;:&quot;discussion&quot;,&quot;body&quot;:&quot;&lt;p&gt;I don&amp;#039;t even know how to put this politely anymore. &lt;\\\/p&gt;&lt;p&gt;It&amp;#039;s been four years and the S4Mk3 still has no MIDI mode.&lt;\\\/p&gt;&lt;p&gt;This is far beyond disgusting. I&amp;#039;ts feels more like a Pioneer move honestly.&lt;\\\/p&gt;&lt;p&gt;When is NI going to fix this?&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:\\&quot;I don't even know how to put this politely anymore. \\\\nIt's been four years and the S4Mk3 still has no MIDI mode.\\\\nThis is far beyond disgusting. I'ts feels more like a Pioneer move honestly.\\\\nWhen is NI going to fix this?\\\\n\\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2022-12-27T11:31:12+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:283103,&quot;name&quot;:&quot;marinelli&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/marinelli&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/s.gravatar.com\\\/avatar\\\/c9e4a5e95eb5647edcf15dc6361f9a8d?s=480&amp;r=pg&amp;d=https%3A%2F%2Fcdn.auth0.com%2Favatars%2Fwa.png&quot;,&quot;dateLastActive&quot;:&quot;2025-07-10T14:34:35+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Helper&quot;,&quot;labelHtml&quot;:&quot;Helper&quot;,&quot;rankID&quot;:3},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:true,&quot;showPostLink&quot;:true,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/9022\\\/why-does-the-s4mk3-still-not-have-midi-mode&quot;,&quot;embedType&quot;:&quot;quote&quot;,&quot;name&quot;:&quot;Why does the S4MK3 still not have MIDI mode?&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/9022\/why-does-the-s4mk3-still-not-have-midi-mode\">\n        https:\/\/community.native-instruments.com\/discussion\/9022\/why-does-the-s4mk3-still-not-have-midi-mode\n    <\/a>\n<\/div>\n<p>Hi <a class=\"atMention\" data-username=\"marinelli\" data-userid=\"283103\" href=\"https:\/\/community.native-instruments.com\/profile\/marinelli\">@marinelli<\/a>, <\/p><p>from what I heard, this decision has been made during the development of the S4 MK3 based on two basic shortcomings that would apply when trying to use the controller in MIDI mode: neither the jog wheels nor the displays would be functional, and this is a technical limitation you couldn't work around. <\/p><p>I am not trying to justify this decision, just sharing context.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Markovicz\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/UG9PC79DRNVE\/n8WTWQQW57K15.jpg\" alt=\"Photo of Markovicz\" \/>\n<span class=\"seoUserName\">Markovicz<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:46468,&quot;recordType&quot;:&quot;comment&quot;,&quot;body&quot;:&quot;&lt;p&gt;In case you did not know, the S2 MK3 and S3 MIDI Modes has been removed from the firmware and the Controller Editor!&lt;\\\/p&gt;&lt;p&gt;Chances are wery low that we will ever get the MIDI mode on S4.&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:\\&quot;In case you did not know, the S2 MK3 and S3 MIDI Modes has been removed from the firmware and the Controller Editor!\\\\nChances are wery low that we will ever get the MIDI mode on S4. \\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2022-12-27T11:49:21+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:247166,&quot;name&quot;:&quot;Stevan&quot;,&quot;url&quot;:&quo  neither the jog wheels nor the displays would be functional, and this is a technical limitation you couldn&amp;#039;t work around. &lt;\\\/p&gt;&lt;p&gt;I am not trying to justify this decision, just sharing context.&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:\\&quot;https:\\\\\\\/\\\\\\\/community.native-instruments.com\\\\\\\/discussion\\\\\\\/9022\\\\\\\/why-does-the-s4mk3-still-not-have-midi-mode\\&quot;,\\&quot;attributes\\&quot;:{\\&quot;link\\&quot;:\\&quot;https:\\\\\\\/\\\\\\\/community.native-instruments.com\\\\\\\/discussion\\\\\\\/9022\\\\\\\/why-does-the-s4mk3-still-not-have-midi-mode\\&quot;}},{\\&quot;insert\\&quot;:\\&quot;\\\\n\\&quot;},{\\&quot;insert\\&quot;:\\&quot;Hi \\&quot;},{\\&quot;insert\\&quot;:{\\&quot;mention\\&quot;:{\\&quot;name\\&quot;:\\&quot;marinelli\\&quot;,\\&quot;userID\\&quot;:283103}}},{\\&quot;insert\\&quot;:\\&quot;, \\\\nfrom what I heard, this decision has been made during the development of the S4 MK3 based on two basic shortcomings that would apply when trying to use the controller in MIDI mode: neither the jog wheels nor the displays would be functional, and this is a technical limitation you couldn't work around. \\\\nI am not trying to justify this decision, just sharing context. \\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2023-02-17T09:05:34+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:348264,&quot;name&quot;:&quot;Markovicz&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/Markovicz&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/us.v-cdn.net\\\/6034896\\\/uploads\\\/userpics\\\/UG9PC79DRNVE\\\/n8WTWQQW57K15.jpg&quot;,&quot;dateLastActive&quot;:&quot;2026-02-23T11:14:13+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Pro&quot;,&quot;labelHtml&quot;:&quot;Pro&quot;,&quot;rankID&quot;:117},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:false,&quot;showPostLink&quot;:false,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/53602#Comment_53602&quot;,&quot;embedType&quot;:&quot;quote&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/comment\/53602#Comment_53602\">\n        https:\/\/community.native-instruments.com\/discussion\/comment\/53602#Comment_53602\n    <\/a>\n<\/div>\n<p>The driver is not even available for the mk3.<\/p><p>It is definitely more intricate than previous controllers. As said \"the jogs!\"<\/p><p>Although I think the initial release of the S4mk3 had no midi mappable controls at all, NI did add some later.<\/p><p>My guess is that it would have been a support nightmare, everyone constantly saying they couldn't get it to work.<\/p><\/div>\n    <\/div>\n    <div class=\"comment separated\">\n        <div><a href=\"https:\/\/community.native-instruments.com\/profile\/Markovicz\" class=\"seoUser\">\n<img height=\"24px\" width=\"24px\" src=\"https:\/\/us.v-cdn.net\/6034896\/uploads\/userpics\/UG9PC79DRNVE\/n8WTWQQW57K15.jpg\" alt=\"Photo of Markovicz\" \/>\n<span class=\"seoUserName\">Markovicz<\/span>\n<\/a><\/div>\n        <div class=\"userContent\"><div class=\"js-embed embedResponsive\" data-embedjson=\"{&quot;recordID&quot;:53606,&quot;recordType&quot;:&quot;comment&quot;,&quot;body&quot;:&quot;&lt;p&gt;&lt;a href=\\&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/53602#Comment_53602\\&quot; rel=\\&quot;nofollow noopener ugc\\&quot;&gt;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/53602#Comment_53602&lt;\\\/a&gt;&lt;\\\/p&gt;&lt;p&gt;The driver is not even available for the mk3.&lt;\\\/p&gt;&lt;p&gt;It is definitely more intricate than previous controllers. As said &amp;quot;the jogs!&amp;quot;&lt;\\\/p&gt;&lt;p&gt;Although I think the initial release of the S4mk3 had no midi mappable controls at all, NI did add some later.&lt;\\\/p&gt;&lt;p&gt;My guess is that it would have been a support nightmare, everyone constantly saying they couldn&amp;#039;t get it to work.&lt;\\\/p&gt;&quot;,&quot;bodyRaw&quot;:&quot;[{\\&quot;insert\\&quot;:\\&quot;https:\\\\\\\/\\\\\\\/community.native-instruments.com\\\\\\\/discussion\\\\\\\/comment\\\\\\\/53602#Comment_53602\\&quot;,\\&quot;attributes\\&quot;:{\\&quot;link\\&quot;:\\&quot;https:\\\\\\\/\\\\\\\/community.native-instruments.com\\\\\\\/discussion\\\\\\\/comment\\\\\\\/53602#Comment_53602\\&quot;}},{\\&quot;insert\\&quot;:\\&quot;\\\\n\\&quot;},{\\&quot;insert\\&quot;:\\&quot;The driver is not even available for the mk3.\\\\nIt is definitely more intricate than previous controllers. As said \\\\\\&quot;the jogs!\\\\\\&quot;\\\\nAlthough I think the initial release of the S4mk3 had no midi mappable controls at all, NI did add some later.\\\\nMy guess is that it would have been a support nightmare, everyone constantly saying they couldn't get it to work.\\\\n\\\\n\\&quot;}]&quot;,&quot;format&quot;:&quot;rich&quot;,&quot;dateInserted&quot;:&quot;2023-02-17T09:14:43+00:00&quot;,&quot;insertUser&quot;:{&quot;userID&quot;:213577,&quot;name&quot;:&quot;zephry&quot;,&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/profile\\\/zephry&quot;,&quot;photoUrl&quot;:&quot;https:\\\/\\\/us.v-cdn.net\\\/6034896\\\/uploads\\\/userpics\\\/CBTZXJICRX42\\\/nCOGIMBFB4O2U.png&quot;,&quot;dateLastActive&quot;:&quot;2026-09-11T07:43:11+00:00&quot;,&quot;banned&quot;:0,&quot;punished&quot;:0,&quot;private&quot;:false,&quot;label&quot;:&quot;Guru&quot;,&quot;labelHtml&quot;:&quot;Guru&quot;,&quot;rankID&quot;:4},&quot;displayOptions&quot;:{&quot;showUserLabel&quot;:false,&quot;showCompactUserInfo&quot;:true,&quot;showDiscussionLink&quot;:false,&quot;showPostLink&quot;:false,&quot;showCategoryLink&quot;:false,&quot;renderFullContent&quot;:false,&quot;expandByDefault&quot;:false},&quot;url&quot;:&quot;https:\\\/\\\/community.native-instruments.com\\\/discussion\\\/comment\\\/53606#Comment_53606&quot;,&quot;embedType&quot;:&quot;quote&quot;}\">\n    <a href=\"https:\/\/community.native-instruments.com\/discussion\/comment\/53606#Comment_53606\">\n        https:\/\/community.native-instruments.com\/discussion\/comment\/53606#Comment_53606\n    <\/a>\n<\/div>\n<p>Which driver are you referring to?<\/p><\/div>\n    <\/div>\n\n\n    <\/div>","$reactProps":{"acceptedAnswersApiParams":{"sort":"dateInserted","maxDepth":1,"collapseChildDepth":3,"parentRecordType":"discussion","parentRecordID":9022,"page":1,"limit":500,"expand":["insertUser","updateUser","reactions","attachments","reportMeta","insertUser.badges","warnings","insertUser.signature"],"defaultSort":"dateInserted","qna":"accepted"},"acceptedAnswers":{"paging":{"nextURL":null,"prevURL":null,"currentPage":1,"total":1,"limit":500},"data":[{"commentID":55510,"discussionID":9022,"parentRecordType":"discussion","parentRecordID":9022,"name":"Re: Why does the S4MK3 still not have MIDI mode?","categoryID":55,"body":"<p>Hi everybody,<\/p><p>let me quickly add some insights here. We did not remove MIDI implementation off of the S2 MK3, S3 or S4 MK3. The facts are the following:<\/p><p><strong>S2 and S3<\/strong> have what we call native MIDI support. These two units have a specific MIDI control assigned to each button and knob on the device as part of their firmware. This eliminated the need to use the Controller Editor for these units. Unfortunately this also removes the option to change the Note or CC that a specific control is sending. <\/p><p>Bottom line, these devices send MIDI but do not support customisability of what kind of messages are being send.<\/p><p><strong>S4 MK3<\/strong> has never supported MIDI in the first place. This has been a decision we needed to take back during the development process due to the increased architectural complexity of the product.<\/p><p>I hope this has cleared things up a bit <span class=\"safeEmoji nativeEmoji\">\ud83d\ude01<\/span>.<\/p><p>cheers from Berlin<\/p><p>Michael<\/p>","dateInserted":"2023-02-27T14:47:26+00:00","dateUpdated":"2023-02-28T09:44:28+00:00","insertUserID":260850,"updateUserID":358135,"score":5,"depth":1,"scoreChildComments":0,"countChildComments":0,"insertUser":{"userID":260850,"name":"MichaelK_NI","url":"https:\/\/community.native-instruments.com\/profile\/MichaelK_NI","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/avatarstock\/nX1A2T0QV2TZ2.png","dateLastActive":"2026-06-29T16:36:51+00:00","banned":0,"punished":0,"private":false,"label":"Pro","labelHtml":"Pro","postProfileFields":[{"value":"n\/a","displayOptions":{"userCards":false,"posts":false}}],"rankID":117,"badges":[{"badgeID":1,"name":"Photogenic","dateInserted":"2021-11-08T16:57:29+00:00","url":"https:\/\/community.native-instruments.com\/badge\/1\/photogenic","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/badges\/0V4U8G44501C.png"},{"badgeID":98,"name":"Original Member Silver","dateInserted":"2021-11-19T13:16:23+00:00","url":"https:\/\/community.native-instruments.com\/badge\/98\/original-member-3","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/badges\/VHBF02LZB8SZ.png"},{"badgeID":24,"name":"Ancient Membership","dateInserted":"2021-11-08T16:57:29+00:00","url":"https:\/\/community.native-instruments.com\/badge\/24\/anniversary-old","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/badges\/LP9IB64CWPQJ.png"},{"badgeID":87,"name":"First Answer","dateInserted":"2021-11-10T19:21:34+00:00","url":"https:\/\/community.native-instruments.com\/badge\/87\/answer","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/badges\/16RIJN2AGS23.png"},{"badgeID":6,"name":"100 Comments","dateInserted":"2021-11-08T16:57:29+00:00","url":"https:\/\/community.native-instruments.com\/badge\/6\/comment-100","photoUrl":"https:\/\/us.v-cdn.net\/6034896 to use the Controller Editor for these units. Unfortunately this also removes the option to change the Note or CC that a specific control is sending. <\/p><p>Bottom line, these devices send MIDI but do not support customisability of what kind of messages are being send.<\/p><p><strong>S4 MK3<\/strong> has never supported MIDI in the first place. This has been a decision we needed to take back during the development process due to the increased architectural complexity of the product.<\/p><p>I hope this has cleared things up a bit <span class=\"safeEmoji nativeEmoji\">\ud83d\ude01<\/span>.<\/p><p>cheers from Berlin<\/p><p>Michael<\/p>","insertUserID":260850,"url":"https:\/\/community.native-instruments.com\/discussion\/comment\/55510#Comment_55510","dateInserted":"2023-02-27 14:47:26","score":5,"insertUser":{"userID":260850,"name":"MichaelK_NI","url":"https:\/\/community.native-instruments.com\/profile\/MichaelK_NI","photoUrl":"https:\/\/us.v-cdn.net\/6034896\/uploads\/avatarstock\/nX1A2T0QV2TZ2.png","dateLastActive":"2026-06-29T16:36:51+00:00","banned":0,"punished":0,"private":false,"label":"Pro","labelHtml":"Pro","postProfileFields":[{"value":"n\/a","displayOptions":{"userCards":false,"posts":false}}],"rankID":117}}]}},"reactions":[{"tagID":11,"urlcode":"Down","name":"Vote Down","class":"Negative","hasReacted":false,"reactionValue":-1,"count":0},{"tagID":12,"urlcode":"Up","name":"Vote Up","class":"Positive","hasReacted":false,"reactionValue":1,"count":0},{"tagID":15,"urlcode":"LOL","name":"Funny","class":"Positive","hasReacted":false,"reactionValue":0,"count":0}],"tags":[],"postMeta":[],"permissions":{"comments.add":false,"comments.delete":false,"comments.edit":false,"discussions.add":false,"discussions.announce":false,"discussions.close":false,"discussions.delete":false,"discussions.edit":false,"discussions.sink":false,"discussions.view":true,"posts.moderate":false},"tagIDs":[],"bookmarked":false,"unread":false,"dismissed":false,"muted":false,"dateLastViewed":null
